services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: golang_expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_user
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - expense_pgdata:/var/lib/postgresql/data

volumes:
  expense_pgdata: